[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Profiles have their own page at /startups/<slug> (written at build time with the link preview);
# any other /startups/ address still gets the app, which shows "not found" or the profile.
# Existing files (those pages, the YAML files) are served as they are.
[[redirects]]
  from = "/startups/*"
  to = "/index.html"
  status = 200
