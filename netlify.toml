[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Profiles have their own page at /startups/<slug> (written at build time with the link preview);
# any other /startups/ address still gets the app, which shows "not found" or the profile.
# Existing files (those pages, the YAML files) are served as they are.
[[redirects]]
  from = "/startups/*"
  to = "/index.html"
  status = 200

# Data files: the versioned copies (/data/v/<version>/, one folder per deploy) never change, so
# browsers may keep them for a year. The plain /data/*.json addresses keep Netlify's default
# (checked on every load).
[[headers]]
  for = "/data/v/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
