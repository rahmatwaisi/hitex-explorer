[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Clean addresses (/jobs, /startups/<slug>…): any address that isn't a file gets the app, which shows
# that page. Files are served as they are (pages written at build time, data, YAML, robots.txt…), and
# dist/_redirects (scripts/build-share-pages.ts) maps /jobs and /startups/<slug> to their own pages.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Data files: the versioned copies (/data/v/<version>/, one folder per deploy) never change, so
# browsers may keep them for a year. The plain /data/*.json addresses keep Netlify's default
# (checked on every load).
[[headers]]
  for = "/data/v/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
