[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Clean addresses: pages written at build time (scripts/build-share-pages.ts) live in folders and are
# served at /jobs/, /startups/<slug>/… (Netlify redirects /jobs to /jobs/). Any other address that
# isn't a file, like /contribution/form, gets the app, which shows that page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Data files: the versioned copies (/data/v/<version>/, one folder per deploy) never change, so
# browsers may keep them for a year. The plain /data/*.json addresses keep Netlify's default
# (checked on every load).
[[headers]]
  for = "/data/v/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
