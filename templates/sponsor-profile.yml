# ═════════════════════════════ 6. CONSENT ═══════════════════════════════════
consent:                               # [required] all must be true
  authorized: true                     # I represent this organization and may publish this profile
  people_agreed: true                  # everyone listed under leadership and contacts agreed
  rights_to_logo: true                 # we own or may use the logo at logo_url
  license: "CC-BY-4.0"                 # profile text is shared openly under this license
