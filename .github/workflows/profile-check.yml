name: Startup profile check

# Runs on pull requests that touch public/startups/. Uses pull_request_target so it can comment on
# pull requests from forks; for that reason it only checks out the trusted base branch and reads the
# pull request's file with `git show` as data. No code from the pull request is ever executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ["public/startups/**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: profile-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ADMINS: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request as data (not checked out)
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the profile
        id: check
        continue-on-error: true
        run: >
          node scripts/check-pr.ts
          --base "$BASE_SHA"
          --head refs/remotes/pr/head
          --author "$PR_AUTHOR"
          --admins "$ADMINS"
          --out profile-check.md

      - name: Comment the result on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('profile-check.md', 'utf8')
            const marker = '<!-- hitex-profile-check -->'
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const previous = comments.find((c) => c.body && c.body.includes(marker))
            if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

      - name: Fail if the check found problems
        if: steps.check.outcome == 'failure'
        run: exit 1
