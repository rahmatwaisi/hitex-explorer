<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="description" content="Search HITEX 2026 startups, exhibitors, sponsors, media, speakers and agenda. An unofficial explorer built on public HITEX data." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HITEX Explorer" />
    <meta property="og:title" content="HITEX Explorer" />
    <meta property="og:description" content="Search HITEX 2026 startups, exhibitors, sponsors, media, speakers and agenda in English, Arabic, Kurdish and Persian." />
    <meta property="og:url" content="https://hitex2026.netlify.app/" />
    <meta property="og:image" content="https://hitex2026.netlify.app/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Noto+Naskh+Arabic:wght@400..700&family=Vazirmatn:wght@100..900&display=swap"
    />
    <title>HITEX Explorer</title>
    <script>
      // apply the saved theme before first paint (dark unless the viewer chose light)
      try {
        if (localStorage.getItem("theme") !== "light") document.documentElement.classList.add("dark")
      } catch {
        document.documentElement.classList.add("dark")
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms detects this form at deploy time; "Send without GitHub" in the profile form posts to it
         (src/components/profile-form/review.tsx). Submissions show under Forms in the Netlify dashboard. -->
    <form name="startup-profile" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="contact" />
      <textarea name="note"></textarea>
      <input name="mode" />
      <input name="hitex_id" />
      <input name="slug" />
      <input name="file" />
      <textarea name="yaml"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
