<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Noto+Naskh+Arabic:wght@400..700&family=Vazirmatn:wght@100..900&display=swap"
    />
    <title>HITEX Explorer</title>
    <script>
      // apply the saved theme before first paint (dark unless the viewer chose light)
      try {
        if (localStorage.getItem("theme") !== "light") document.documentElement.classList.add("dark")
      } catch {
        document.documentElement.classList.add("dark")
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
